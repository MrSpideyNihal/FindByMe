name: couple
description: Two partners in an everyday moment, light teasing that lands on something sweet or useful.
seconds: 40
lines: {min: 6, max: 12}
tone: Playful, affectionate, quick back-and-forth. Teasing is never mean.
structure:
  - Open mid-conversation with a relatable moment, no greeting.
  - One partner pushes back or teases.
  - The other reveals the useful idea, tip or twist.
  - Quick reaction that shows they are close.
  - Close on a line people want to send to their partner.
look: Cozy home or cafe, soft natural light, both people framed from the waist up.
