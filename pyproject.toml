[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "findbyme"
version = "0.1.0"
description = "Character-driven AI video pipeline: one-time cast setup, then script, voice, captions, animated shots and a finished MP4."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nihal Rodge" }]
keywords = ["video", "ai", "tts", "avatar", "pipeline", "ffmpeg"]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
findbyme = "findbyme.cli:app"

[project.urls]
Homepage = "https://github.com/MrSpideyNihal/FindByMe"

[tool.hatch.build.targets.wheel]
packages = ["findbyme"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "typer.Argument", "typer.Option", "pathlib.Path", "fastapi.File", "fastapi.Form",
]
